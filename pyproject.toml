[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-particle-sliders"
version = "0.4.1"
description = "Anima Turbo product adapter for the Particle Sliders image lifecycle"
readme = "LIFECYCLE.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "ANIMA-LICENSE.md"]
dependencies = [
  "safetensors>=0.4,<1",
  "packaging>=24",
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@cc642acb55c3db5826222fd494539fe1944a4fa0#subdirectory=packages/particle-sliders-core",
]

[project.optional-dependencies]
vibe = ["particle-sliders-vibe[nanoodle] @ git+https://github.com/HyperGAN/particle-sliders.git@4bae4e08db7c71772cbea14e1ae1d7f5135e8290#subdirectory=packages/particle-sliders-vibe"]
native = [
  "numpy>=1.26", "pillow>=13.0.0,<14", "torchvision>=0.21,<1", "accelerate==1.14.0",
  "transformers==5.15.0", "huggingface-hub==1.27.0",
  "diffusers @ git+https://github.com/huggingface/diffusers.git@d5baa4fb548294f47dbca49890abd4b291204c60",
]

[project.entry-points."particle_sliders.image_backends"]
anima = "lumen_studio.lifecycle:BACKEND"

[project.scripts]
anima-vibe = "lumen_studio.vibe_cli:main"
anima-vibe-targets = "lumen_studio.vibe:prepare_main"
anima-vibe-train = "lumen_studio.study.cli:main"
anima-vibe-render = "lumen_studio.study.replay:main"

[project.entry-points."particle_sliders.inference_backends"]
anima = "lumen_studio.lifecycle:NATIVE_BACKEND"

[tool.setuptools]
py-modules = ["particle_io", "single_particle", "comfy_particle"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lumen_studio*", "configs.anima*"]
namespaces = true

[tool.setuptools.package-data]
"configs.anima" = ["*.json", "requirements.lock", "candidates/*.json", "boss-teachers/*.json", "boss-teachers/*.png"]
lumen_studio = ["engine-source.json", "calibration/*.png", "calibration/*.json", "static/*", "vendor/LICENSE", "vendor/provenance.json"]
